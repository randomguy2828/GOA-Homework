<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div id="formbox">
        <h2>add new product</h2>

        <input type="text" id="nameinput" placeholder="product name">
        <input type="number" id="priceinput" placeholder="product price">
        <input type="text" id="imageinput" placeholder="image url">
        <input type="text" id="descinput" placeholder="description tecnic, housethings or clothes">

        <button id="addbtn">add to cart</button>
    </div>

    <div id="filterbox">
        <button id="btnall">show all</button>
        <button id="btnclothes">show clothes</button>
        <button id="btntecnic">show tecnic</button>
        <button id="btnhousethings">show housethings</button>
    </div>

    <div id="container"></div>


    <script src="./script.js"></script>
</body>
</html>
